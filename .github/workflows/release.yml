name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*' # prerelease tags (e.g. v0.8.0-next.0)

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc   # single source for "what we run"; the floor lives in engines
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Pin npm: npm@12.0.0 broke provenance signing under trusted publishing
      # ("Cannot find module 'sigstore'"). 11.18.0 is the last known-good line
      # above the trusted-publishing floor. Revisit once npm ships a 12.x fix.
      - run: npm install -g npm@11.18.0

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # All public packages (mcp-server and flow-runner graduated from the
      # experimental dist-tag in 2026-07) go through the single changesets
      # path — it publishes via pnpm, which rewrites workspace:* dependencies
      # to real versions. Never publish these packages with raw `npm publish`:
      # it keeps the literal workspace:* and ships an uninstallable tarball.
      - name: Publish packages
        id: publish
        run: pnpm changeset publish --no-git-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Tags with a prerelease identifier (e.g. v0.8.0-next.1) are marked as
          # pre-release so GitHub keeps "Latest" on the newest stable release.
          prerelease: ${{ contains(github.ref_name, '-') }}

      # tapflow.dev deploys from `docs-production`, not main, so the site describes what npm serves
      # rather than what main is about to ship. Only the newest stable tag moves it, and the commit
      # pushed is the tag's tree without workflow files — `scripts/docs-production.mjs` says why for
      # both. Last, and gated on publish rather than on every step before it: once the packages are
      # out the docs should follow even if the GitHub Release step failed.
      #
      # Tags are fetched again because the checkout is minutes old by now: a patch tagged meanwhile
      # must make this run skip, not roll the site back. The push is a fast-forward, so if another
      # run moved the branch after the fetch it is rejected rather than overwritten.
      # Hotfix procedure: CONTRIBUTING.md, "Docs follow releases".
      - name: Point docs-production at this release
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        run: |
          git fetch --tags --force origin
          decision=$(node scripts/docs-production.mjs "$GITHUB_REF_NAME")
          echo "$decision"
          if [ "$decision" = move ]; then
            # No parent only on the first release, when the branch does not exist yet. A fetch that
            # failed for another reason yields a parentless commit too, and the push rejects that as
            # a non-fast-forward.
            parent=
            if git fetch origin refs/heads/docs-production; then parent=$(git rev-parse FETCH_HEAD); fi
            commit=$(node scripts/docs-production.mjs --commit "$GITHUB_REF_NAME" $parent)
            git push origin "$commit:refs/heads/docs-production"
          fi
